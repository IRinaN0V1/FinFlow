version: '3.8'

services:
  postgres:
    image: postgres:17
    container_name: finflow-postgres
    environment:
      POSTGRES_USER: finflow_user
      POSTGRES_PASSWORD: finflow_pass
      POSTGRES_DB: finflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finflow_user -d finflow_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: finflow-app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/finflow_db
      SPRING_DATASOURCE_USERNAME: finflow_user
      SPRING_DATASOURCE_PASSWORD: finflow_pass
    restart: unless-stopped

volumes:
  postgres_data: